server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        # The agent answers as a Server-Sent Events stream. With the default
        # buffering nginx holds the whole response back until the turn ends,
        # which looks exactly like no streaming at all — and only in
        # production, since `vite dev` proxies straight to the API.
        proxy_buffering off;
        proxy_cache off;

        # A tool-heavy agent turn can run well past the old 120s ceiling, and
        # the read timeout applies between reads, not to the whole response.
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
