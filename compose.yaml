name: vhome

# Production topology: every application container is pulled by tag, never
# built here. Local development adds the build stanzas back through
# compose.override.yaml, which Compose merges automatically and which is not
# present on the server.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${VHOME_MYSQL_DATABASE:-vhome}
      MYSQL_USER: ${VHOME_MYSQL_USER:-vhome}
      MYSQL_PASSWORD: ${VHOME_MYSQL_PASSWORD:?VHOME_MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${VHOME_MYSQL_ROOT_PASSWORD:?VHOME_MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${VHOME_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - vhome_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - vhome_internal

  # One-shot: brings the schema up to date, then exits. The API waits for it to
  # finish successfully, so new code never meets an old schema.
  migrate:
    image: migrate/migrate:v4.19.0
    restart: "no"
    command:
      - -path=/migrations
      - -database=mysql://${VHOME_MYSQL_USER:-vhome}:${VHOME_MYSQL_PASSWORD:?VHOME_MYSQL_PASSWORD is required}@tcp(mysql:3306)/${VHOME_MYSQL_DATABASE:-vhome}?multiStatements=true
      - up
    volumes:
      - ./migrations:/migrations:ro,Z
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vhome_internal

  api:
    image: ${VHOME_IMAGE_REGISTRY:-vhome}/vhome-api:${VHOME_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      VHOME_ENV: ${VHOME_ENV:-development}
      VHOME_HTTP_ADDR: :8080
      VHOME_HTTP_READ_HEADER_TIMEOUT: 5s
      VHOME_HTTP_READ_TIMEOUT: 15s
      VHOME_HTTP_WRITE_TIMEOUT: 15s
      VHOME_HTTP_IDLE_TIMEOUT: 60s
      VHOME_HTTP_SHUTDOWN_TIMEOUT: 10s
      VHOME_DB_HOST: mysql
      VHOME_DB_PORT: 3306
      VHOME_DB_USER: ${VHOME_MYSQL_USER:-vhome}
      VHOME_DB_PASSWORD: ${VHOME_MYSQL_PASSWORD:?VHOME_MYSQL_PASSWORD is required}
      VHOME_DB_NAME: ${VHOME_MYSQL_DATABASE:-vhome}
      VHOME_DB_LOCATION: Asia/Shanghai
      VHOME_DB_MAX_OPEN_CONNS: 20
      VHOME_DB_MAX_IDLE_CONNS: 10
      VHOME_DB_CONN_MAX_LIFETIME: 3m
      VHOME_DB_CONN_MAX_IDLE_TIME: 1m
      VHOME_DB_CONNECT_TIMEOUT: 10s
      VHOME_DB_READ_TIMEOUT: 5s
      VHOME_DB_WRITE_TIMEOUT: 5s
      VHOME_AUTH_SESSION_TTL: 336h
      VHOME_AUTH_COOKIE_NAME: vhome_session
      VHOME_AUTH_COOKIE_SECURE: ${VHOME_AUTH_COOKIE_SECURE:-false}
      VHOME_SECRET_ENCRYPTION_KEY: ${VHOME_SECRET_ENCRYPTION_KEY:?VHOME_SECRET_ENCRYPTION_KEY is required}
      DEEPSEEK_APIKEY: ${DEEPSEEK_APIKEY:?DEEPSEEK_APIKEY is required}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?DEEPSEEK_MODEL is required}
      DEEPSEEK_BASEURL: ${DEEPSEEK_BASEURL:?DEEPSEEK_BASEURL is required}
      GLM_APIKEY: ${GLM_APIKEY:-}
      GLM_MODEL: ${GLM_MODEL:-}
      GLM_BASEURL: ${GLM_BASEURL:-}
    volumes:
      - vhome_uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - vhome_internal

  web:
    image: ${VHOME_IMAGE_REGISTRY:-vhome}/vhome-web:${VHOME_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${VHOME_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - vhome_internal

volumes:
  vhome_mysql_data:
  vhome_uploads:

networks:
  vhome_internal:
    driver: bridge
