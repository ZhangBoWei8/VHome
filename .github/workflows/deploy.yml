name: Deploy

on:
  # Start with manual runs only. Once a few deploys have gone through cleanly,
  # uncomment the push trigger to deploy every merge to main.
  #
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 commit SHA 或分支，留空则用 main 的最新提交"
        required: false
        default: ""
      build_only:
        description: "只构建并推送镜像，跳过部署（服务器还没装 runner 时勾选）"
        type: boolean
        required: false
        default: false

# Deploys must never overlap, and a running deploy must never be cancelled
# halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Everything defaults to GHCR under this repository's owner, so the
      # GHCR path needs no repository configuration at all. Set the
      # VHOME_IMAGE_REGISTRY variable to push somewhere else.
      - id: cfg
        run: |
          registry='${{ vars.VHOME_IMAGE_REGISTRY }}'
          if [ -z "$registry" ]; then
            owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            registry="ghcr.io/$owner"
          fi

          host='${{ vars.VHOME_REGISTRY_HOST }}'
          [ -n "$host" ] || host="${registry%%/*}"

          {
            echo "registry=$registry"
            echo "host=$host"
            echo "sha=$(git rev-parse HEAD)"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # With GHCR the fallbacks work out of the box and no secret is needed.
      # For any other registry set the two secrets.
      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.cfg.outputs.host }}
          username: ${{ secrets.VHOME_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.VHOME_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.cfg.outputs.registry }}/vhome-${{ matrix.target }}:${{ steps.cfg.outputs.sha }}
            ${{ steps.cfg.outputs.registry }}/vhome-${{ matrix.target }}:latest
          build-args: |
            GIT_COMMIT=${{ steps.cfg.outputs.sha }}
            BUILD_TIME=${{ steps.cfg.outputs.built_at }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    name: Deploy to production
    needs: build
    # Skipped for a build-only run, which is how the registry path is verified
    # before the self-hosted runner exists. Without this the job would sit in
    # the queue forever waiting for a runner that is not there yet.
    if: ${{ !inputs.build_only }}
    runs-on: [self-hosted, vhome-prod]
    steps:
      # The script, compose.yaml, the migrations and the private .env all live
      # in the deployment directory on the server. The runner only triggers the
      # rollout; it checks nothing out here.
      - name: Roll out
        run: |
          dir='${{ vars.VHOME_DEPLOY_DIR }}'
          [ -n "$dir" ] || dir=/opt/vhome
          "$dir/deploy/deploy-remote.sh" '${{ inputs.ref || github.sha }}'

  # Keeps exactly two versions per image: the one just deployed and the one
  # before it. That is the minimum that still supports the rollback in
  # deploy-remote.sh, which only ever goes back to .last-good-tag, and it keeps
  # storage small enough that making the packages private stays an option.
  #
  # The trade-off is deliberate: rolling back two deploys is no longer possible
  # from the registry. Raise min-versions-to-keep if that becomes a problem.
  #
  # Never runs for a non-GHCR registry, which has its own retention rules.
  cleanup:
    name: Prune old image versions
    needs: deploy
    if: ${{ vars.VHOME_IMAGE_REGISTRY == '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    strategy:
      matrix:
        target: [api, web]
    steps:
      # A push tags one manifest with both the SHA and `latest`, so the newest
      # version carries both and two versions means two deploys.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: vhome-${{ matrix.target }}
          package-type: container
          min-versions-to-keep: 2
          ignore-versions: '^latest$'
